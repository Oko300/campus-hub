[www]
user = nginx
group = nginx
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
chdir = /var/www/html

; Allow all environment variables from the system (Render)
clear_env = no

; Explicitly pass the database variables (most reliable method)
env[DB_DRIVER] = $DB_DRIVER
env[DB_HOST] = $DB_HOST
env[DB_PORT] = $DB_PORT
env[DB_NAME] = $DB_NAME
env[DB_USER] = $DB_USER
env[DB_PASS] = $DB_PASS
env[APP_ENV] = $APP_ENV
env[APP_NAME] = $APP_NAME
env[APP_SECRET] = $APP_SECRET
env[SCHOOL_NAME] = $SCHOOL_NAME
env[SCHOOL_SHORT] = $SCHOOL_SHORT
